name: Fund holdings

# Quarterly holdings of the iShares S&P 400 and 600 funds from SEC Form N-PORT
# (scripts/fund_holdings.py), the source of the mid and small-cap membership history.
on:
  schedule:
    - cron: "10 7 3 * *" # 07:10 UTC on the 3rd of each month
  workflow_dispatch:
    inputs:
      max:
        description: "Filings to read"
        default: "60"
      old:
        description: "Pre-2019 filings to read"
        default: "25"
      budget:
        description: "Minutes for past members' prices"
        default: "40"

permissions:
  contents: write

concurrency:
  group: evening
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      TIINGO_API_KEY: ${{ secrets.END_OF_DAY_DATA || secrets.TIINGO_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - run: scripts/price_store.sh pull
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/fund_holdings.py --max "${{ inputs.max || 60 }}"
      - name: Holdings before N-PORT (2009 to mid-2019, from N-Q and N-CSR schedules of investments)
        run: python scripts/fund_holdings_old.py --max "${{ inputs.old || 25 }}"
        timeout-minutes: 40
        continue-on-error: true
      - name: Membership intervals (CUSIPs without a ticker looked up on OpenFIGI)
        run: python scripts/build_membership.py --figi
      - name: Daily prices for past members no longer in the universe (Yahoo, else Tiingo; checked against the filings)
        run: python scripts/departed.py --budget-min ${{ inputs.budget || 40 }}
        timeout-minutes: 60
        continue-on-error: true
      - name: Index check (copies of the S&P 400 and 600 from their members against the funds)
        run: python scripts/smid_check.py --report reports/smid_check.md
        continue-on-error: true
      - name: Commit the holdings
        run: |
          git config user.name "bullpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          scripts/price_store.sh push prices_departed
          for p in reports/smid_check.md data/history/departed.json data/history/fund_holdings data/history/cusip_map.json universe/history/sp400_membership.csv universe/history/sp600_membership.csv; do [ -e "$p" ] && git add "$p"; done
          git diff --cached --quiet || git commit -m "Fund holdings $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push && break; sleep 20; done
