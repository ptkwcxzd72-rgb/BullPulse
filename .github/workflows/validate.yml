name: Validate score

# Monthly: refreshes the insider-dealing history, re-runs the out-of-sample backtest (score
# quintiles vs forward returns) and the point-in-time tests of the fundamentals, rebuilds the
# month-end history panel, then runs the learning loop (cmd/learn): walk-forward weights, the
# champion/challenger decision, event studies and the graded live record.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *" # monthly, on the 1st

permissions:
  contents: write
  issues: write
  actions: write # to start "Publish site" once the new files are on the site-data branch

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Point-in-time fundamentals from SEC filings
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python scripts/fundamentals_history.py
        continue-on-error: true
      - name: Point-in-time UK fundamentals (from the cached annual reports)
        run: python scripts/uk_fundamentals_history.py
        continue-on-error: true
      - name: Insider dealing history from the SEC's quarterly data sets (backfills from 2015 on the first run)
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: python scripts/insider_history.py
        timeout-minutes: 60
        continue-on-error: true
      - name: Run validation
        run: go run ./cmd/validate
      - name: Month-end history for "Test this screen"
        run: go run ./cmd/panel
      - name: Learn (walk-forward weights, champion and challenger), event studies and the live record
        run: go run ./cmd/learn
      - name: Commit report
        run: |
          git config user.name "bullpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports data/learning data/history/insiders
          git diff --cached --quiet || git commit -m "Validation report $(date -u +%F)"
          git pull --rebase origin main
          git push
          scripts/site_data.sh push --only data/validation.json data/panel.json data/valhist.json data/learning.json data/eventstudy.json data/live.json
      - name: Publish the website with the new files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Open an issue if the run failed (GitHub emails you about new issues)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Validate score failed on $(date -u +%F)"
          if ! gh issue list --state open --label run-failure --search "$title" --json number --jq '.[0].number' | grep -q .; then
            gh label create run-failure --color B60205 --description "Automated run failures" 2>/dev/null || true
            gh issue create --title "$title" --label run-failure --body "The **Validate score** workflow failed. Open the run to see which step: $RUN_URL"
          fi
