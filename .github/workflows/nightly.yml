name: Nightly update

# Runs after the US close on weekdays: sync prices, fetch and score news,
# rank every stock, commit the data and publish the website to GitHub Pages.
on:
  schedule:
    - cron: "15 21 * * 1-5" # 21:15 UTC = after the 16:00 New York close (summer and winter)
  workflow_dispatch:
    inputs:
      news_days:
        description: "News look-back window in days (use 30 on the first run)"
        default: "2"

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment:
      name: github-pages
    env:
      # prices: END_OF_DAY_DATA (or TIINGO_API_KEY); news: NEWS_UPDATES (falls back to the price key)
      TIINGO_API_KEY: ${{ secrets.END_OF_DAY_DATA || secrets.TIINGO_API_KEY }}
      TIINGO_NEWS_KEY: ${{ secrets.NEWS_UPDATES || secrets.END_OF_DAY_DATA || secrets.TIINGO_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      TIINGO_TIER: ${{ vars.TIINGO_TIER || 'free' }}
      MAX_TICKERS: ${{ vars.MAX_TICKERS }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python packages (CPU-only PyTorch for FinBERT)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements.txt

      - name: Cache FinBERT model
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: finbert-v1

      - name: Sync end-of-day prices (cinar/indicator indicator-sync + Tiingo)
        run: scripts/sync_prices.sh

      - name: UK end-of-day prices (FTSE 100) and GBP exchange rates
        run: python scripts/sync_uk_prices.py
        continue-on-error: true

      - name: Revenue and earnings growth from SEC filings (weekly)
        run: python scripts/fetch_fundamentals.py
        continue-on-error: true

      - name: Insider dealing from SEC Form 4 filings
        run: python scripts/fetch_insiders.py
        continue-on-error: true

      - name: UK annual-report figures from ESEF filings (weekly)
        run: python scripts/fetch_uk_fundamentals.py
        continue-on-error: true

      - name: Fetch news (Tiingo or Finnhub for US if available, GDELT otherwise)
        run: python scripts/fetch_news.py --days "${{ github.event.inputs.news_days || '2' }}"

      - name: Score headlines with FinBERT
        run: python scripts/score_news.py

      - name: Rank stocks (with data-quality checks and score history)
        run: go run ./cmd/screener

      - name: Commit data
        run: |
          git config user.name "bullpulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/data site/feeds
          git diff --cached --quiet || git commit -m "Nightly data $(date -u +%F)"
          git pull --rebase origin main
          git push

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5

      - name: Open an issue if the run failed (GitHub emails you about new issues)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly update failed on $(date -u +%F)"
          if ! gh issue list --state open --label run-failure --search "$title" --json number --jq '.[0].number' | grep -q .; then
            gh label create run-failure --color B60205 --description "Automated run failures" 2>/dev/null || true
            gh issue create --title "$title" --label run-failure --body "The **Nightly update** workflow failed. Open the run to see which step: $RUN_URL"
          fi
