name: Check setup

# SMOKE-TEST VARIANT (branch smoke-test only): reproduce the nightly with real Tiingo prices
# for a small sample, then rank. Never touches main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    env:
      TIINGO_API_KEY: ${{ secrets.END_OF_DAY_DATA || secrets.TIINGO_API_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Sample prices from Tiingo (12 tickers)
        run: |
          python3 - <<'PY'
          import csv
          rows = list(csv.DictReader(open("universe/us.csv")))[:12]
          with open("/tmp/us12.csv", "w", newline="") as f:
              w = csv.DictWriter(f, fieldnames=rows[0].keys(), lineterminator="\n"); w.writeheader(); w.writerows(rows)
          PY
          mkdir -p /tmp/u && cp /tmp/us12.csv /tmp/u/us.csv && cp universe/uk.csv /tmp/u/uk.csv
          go run github.com/cinar/indicator/v2/cmd/indicator-sync@v2.1.44 -source-name tiingo -source-config "$TIINGO_API_KEY" -target-name filesystem -target-config data/prices -days 3650 -delay 2 $(python3 -c "import csv;print(' '.join(r['provider_ticker'] for r in csv.DictReader(open('/tmp/u/us.csv'))))")
          f=$(ls data/prices/*.csv | grep -v uk- | head -1); echo "::notice::$(ls data/prices/*.csv | grep -vc uk-) US files; $f head: $(head -3 $f | tr '\n' '|') tail: $(tail -1 $f)"
      - name: SEC and insiders for the sample
        run: |
          python scripts/fetch_fundamentals.py --universe /tmp/u --max-age-days 0
          python scripts/fetch_insiders.py --universe /tmp/u
      - name: Rank
        run: go run ./cmd/screener -universe /tmp/u && echo "::notice::screener ok"
