name: Check setup

# Quick check (under a minute) that the Tiingo keys reach the workflows and work.
# Never prints the keys themselves.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    env:
      EOD_KEY: ${{ secrets.END_OF_DAY_DATA || secrets.TIINGO_API_KEY }}
      NEWS_KEY: ${{ secrets.NEWS_UPDATES || secrets.END_OF_DAY_DATA || secrets.TIINGO_API_KEY }}
      NEWS_SEPARATE: ${{ secrets.NEWS_UPDATES != '' }}
    steps:
      - name: Are the secrets visible to the workflow?
        run: |
          if [[ -z "$EOD_KEY" ]]; then
            echo "::error::No price key. Add an Actions secret named END_OF_DAY_DATA (Settings > Secrets and variables > Actions > Secrets)."
            exit 1
          fi
          echo "::notice::Price key END_OF_DAY_DATA is visible (${#EOD_KEY} characters)."
          if [[ "$NEWS_SEPARATE" == "true" ]]; then
            echo "::notice::News key NEWS_UPDATES is visible (${#NEWS_KEY} characters)."
          else
            echo "::notice::No NEWS_UPDATES secret; news will use the price key."
          fi

      - name: Does Tiingo accept the keys?
        run: |
          check () {
            local label="$1" key="$2" url="$3"
            key="$(echo -n "$key" | tr -d '[:space:]')"
            code=$(curl -s -o /tmp/body -w "%{http_code}" -H "Content-Type: application/json" -H "Authorization: Token $key" "$url")
            body="$(head -c 160 /tmp/body | tr -d '\n')"
            case "$code" in
              200) echo "::notice::OK - $label: HTTP 200 - ${body}" ;;
              401|403) echo "::error::$label: HTTP $code - Tiingo rejected the key or the plan lacks access - ${body}"; return 1 ;;
              429) echo "::warning::$label: HTTP 429 - hourly request limit reached; try again in an hour." ;;
              *) echo "::warning::$label: HTTP $code - ${body}" ;;
            esac
          }
          fail=0
          check "Price key test" "$EOD_KEY" "https://api.tiingo.com/api/test" || fail=1
          check "End-of-day prices (AAPL, last 10 days)" "$EOD_KEY" "https://api.tiingo.com/tiingo/daily/aapl/prices?startDate=$(date -u -d '10 days ago' +%F)" || fail=1
          check "News (1 article)" "$NEWS_KEY" "https://api.tiingo.com/tiingo/news?tickers=aapl&limit=1" || echo "::warning::Tiingo news unavailable with this key; the nightly job will use GDELT for news instead."
          exit $fail
